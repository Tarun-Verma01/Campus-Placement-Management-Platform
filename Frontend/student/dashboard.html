  <title>Student Dashboard — placementhub</title>

</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a href="../index.html" class="brand">placement<span style="color:#1d4ed8">hub</span></a>
      <nav class="nav">
        <a href="dashboard.html" class="active">Dashboard</a>

      </nav>
      <div id="logoutBtn"><button type="button" class="btn-outline" onclick="logout()">Logout</button></div>
    </aside>

    <main class="main container dashboard-page">
      <div class="header-row">
        <div>
          <h2 id="welcome">Welcome</h2>
          <div id="studentEmail" style="color:var(--muted)"></div>
        </div>
      </div>

      <section class="dashboard-section dashboard-overview" aria-labelledby="overviewHeading">
        <h3 id="overviewHeading">Application Overview</h3>
        <div class="stats" id="statsRow">
        <!-- Stats populated by JS -->
        </div>
      </section>

      <section class="dashboard-section eligibility-section" aria-labelledby="eligibilityHeading">
        <h3 id="eligibilityHeading">Eligibility Snapshot</h3>
        <div class="card eligibility-snapshot" id="eligibilitySnapshot">
          <!-- Eligibility information populated by JS -->
        </div>
      </section>

      <section class="dashboard-section deadlines-section" aria-labelledby="deadlinesHeading">
        <h3 id="deadlinesHeading">Upcoming Deadlines</h3>
        <div class="deadline-list" id="upcomingDeadlines">
          <!-- Upcoming deadlines populated by JS -->
        </div>
      </section>

          <div class="progress mt-8" style="margin-top:8px">
            <span id="progressBar" style="width:0%"></span>
          </div>
        </div>
      </section> -->

    </main>
  </div>

  <script src="js/common.js"></script>
  <script src="js/data.js"></script>
  <script src="js/dashboard.js"></script>

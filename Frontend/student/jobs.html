<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Placement Opportunities — placementhub</title>
  <meta name="description" content="Browse campus placement opportunities matched to your academic profile, skills, and eligibility." />
  <link rel="stylesheet" href="css/student.css" />
  <link rel="stylesheet" href="css/jobs.css" />
</head>
<body>
  <div class="app">

    <aside class="sidebar">
      <a href="../index.html" class="brand" aria-label="placementhub home">
        placement<span style="color:#1d4ed8">hub</span>
      </a>

      <nav class="nav" aria-label="Student navigation">
        <a href="dashboard.html">Dashboard</a>
        <a href="jobs.html" class="active" aria-current="page">Jobs</a>
        <a href="applications.html">Applications</a>
        <a href="profile.html">Profile</a>
      </nav>

      <div id="logoutBtn">
        <button type="button" class="btn-outline" onclick="logout()">Logout</button>
      </div>
    </aside>

    <main class="main container" role="main">

      <header class="page-header">
        <h1>Find Your Next Opportunity</h1>
        <p class="page-subtitle">
          Explore placement opportunities matched to your academic profile and skills.
        </p>
      </header>

      <div
        id="jobsContainer"
        role="list"
        aria-label="Placement opportunities"
      >
        <div class="empty-state" id="emptyState" role="status">
          <div class="empty-state-icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"/>
              <path d="M21 21l-4.35-4.35"/>
              <path d="M8 11h6"/>
            </svg>
          </div>

          <h3>No placement opportunities found</h3>
          <p>
            No matching opportunities are currently available.
          </p>

          <button
            type="button"
            id="emptyStateClearBtn"
            class="btn-empty-clear"
            hidden
          >
            Clear Filters
          </button>
        </div>
      </div>

    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/jobs.js"></script>
</body>
</html>
